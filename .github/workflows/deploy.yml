name: Deploy Love2D to GitHub Pages

on:
  push:
    branches:
      - master # 만약 기본 브랜치 이름이 master라면 master로 변경하세요.

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    # 🌟 v4 -> v5 버전업 (Node.js 24 지원)
      - name: Checkout code
        uses: actions/checkout@v5

    # 🌟 v4 -> v6 버전업 (Node.js 24 지원)
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24 # Node 버전도 함께 올려줍니다.

      - name: Install love.js
        run: npm install -g love.js

      - name: Zip game files
        run: zip -r game.love . -x ".git/*" ".github/*"

      - name: Build web version
        run: love.js game.love docs --title "My Love2D Game" --memory 16777216
        
        # 🌟 이 단계를 새로 추가하거나, 기존 Copy 단계에 한 줄을 추가합니다.
      - name: Bypass Jekyll (Create .nojekyll)
        run: |
          touch docs/.nojekyll
          cp docs/index.html docs/404.html

      - name: Copy index.html to docs root
        run: |
          cp docs/index.html docs/404.html

    # 🌟 peaceiris/actions-gh-pages는 내부 엔진이 전환되는 과정이라 
    # env 설정과 위 조치들로 경고가 사라지거나 호환성이 유지됩니다.          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs