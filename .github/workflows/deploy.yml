name: Deploy Love2D to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install love.js
        run: npm install -g love.js

      - name: Zip game files
        run: zip -r game.love . -x ".git/*" ".github/*"

      - name: Build web version
        run: love.js game.love docs --title "JustPingPong" --memory 16777216

      # 🌟 [핵심] SharedArrayBuffer 에러를 해결하기 위한 보안 스크립트 삽입 단계
      - name: Fix SharedArrayBuffer (coi-serviceworker)
        run: |
          touch docs/.nojekyll
          cp docs/index.html docs/404.html
          # 1. coi-serviceworker 라이브러리를 다운로드하여 docs 폴더에 넣습니다.
          curl -sL https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.js -o docs/coi-serviceworker.js
          # 2. index.html의 <head> 태그 바로 뒤에 해당 스크립트를 로드하는 코드를 강제로 삽입합니다.
          sed -i 's|<head>|<head><script src="coi-serviceworker.js"></script>|g' docs/index.html
          sed -i 's|<head>|<head><script src="coi-serviceworker.js"></script>|g' docs/404.html
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs